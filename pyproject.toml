[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "petro-app"
version = "0.1.0"
requires-python = ">=3.11"
description = "Streamlit frontend for petro"
dependencies = [
    "petro>=0.1.0",
    "streamlit>=1.30",
    "plotly>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]